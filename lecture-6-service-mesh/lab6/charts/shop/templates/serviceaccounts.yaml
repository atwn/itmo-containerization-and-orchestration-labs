apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shop.fullname" . }}-api
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shop.fullname" . }}-loadgen
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: loadgen
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shop.fullname" . }}-worker
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: worker
{{- end }}
