apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop.fullname" . }}-api
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: api
    app.kubernetes.io/version: v1
    shop.metrics/enabled: "true"
spec:
  selector: {app.kubernetes.io/name: api, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/version: v1}
  ports: [{name: http, port: {{ .Values.api.service.port }}, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop.fullname" . }}-api-v2
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: api
    app.kubernetes.io/version: v2
    shop.metrics/enabled: "true"
spec:
  selector: {app.kubernetes.io/name: api, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/version: v2}
  ports: [{name: http, port: {{ .Values.api.service.port }}, targetPort: http}]
