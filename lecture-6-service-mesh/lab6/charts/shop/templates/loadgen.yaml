{{- if .Values.loadgen.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop.fullname" . }}-loadgen
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loadgen, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        {{- include "shop.commonLabels" . | nindent 8 }}
        app.kubernetes.io/name: loadgen
      annotations:
        {{- include "shop.meshAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shop.fullname" . }}-loadgen
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: loadgen
          image: "{{ .Values.loadgen.image.repository }}:{{ .Values.loadgen.image.tag }}"
          imagePullPolicy: {{ .Values.loadgen.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - {name: TARGET_URL, value: http://{{ include "shop.fullname" . }}-api}
            - {name: INTERVAL, value: {{ .Values.loadgen.interval | quote }}}
          ports: [{name: http, containerPort: 8080}]
          resources:
            {{- toYaml .Values.loadgen.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 1, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop.fullname" . }}-loadgen
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: loadgen
    shop.metrics/enabled: "true"
spec:
  selector: {app.kubernetes.io/name: loadgen, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}
