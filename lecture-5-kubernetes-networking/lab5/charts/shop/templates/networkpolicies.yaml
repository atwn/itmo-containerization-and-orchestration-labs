{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shop.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
spec:
  # Include CNPG and stray Pods, not only instance=shop.
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- range $name, $spec := .Values.networkPolicy.policies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shop.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "shop.commonLabels" $ | nindent 4 }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- end }}
